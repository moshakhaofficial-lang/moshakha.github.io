name: Auto-pin new content to Pinterest

on:
  # Fires only after a deploy actually succeeds, so it reads pages that are
  # really live rather than racing the CDN.
  workflow_run:
    workflows: ["Build & Deploy to GitHub Pages"]
    types: [completed]
  # Manual re-run/testing without needing a new deploy.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin new articles
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
        run: node scripts/pinterest-auto-pin.mjs

      - name: Commit updated pin manifest
        run: |
          git config user.name "moshakha-bot"
          git config user.email "actions@github.com"
          git add data/pinterest-pinned.json
          git diff --cached --quiet || git commit -m "Record newly auto-pinned articles [skip ci]"
          git diff --cached --quiet || git push
